   ===================================================================== */
function devPinEnabled() { return CONFIG.DEV_PIN_MODE === true; }

function devBuildingList() {
  return state.buildings.length ? state.buildings : CONFIG.campus.buildings.map(b => ({ ...b, id: "cfg-" + b.code }));
}

function mountDevPanel(view) {
  if (!devPinEnabled() || view.querySelector("#devPanel")) return;
  const panel = document.createElement("aside");
  panel.className = "dev-panel"; panel.id = "devPanel";
  view.appendChild(panel);
  renderDevPanel();
}

function renderDevPanel() {
  const panel = document.getElementById("devPanel");
  if (!panel || !devPinEnabled()) return;
  const list = devBuildingList();
  state.dev.index = clamp(state.dev.index, 0, Math.max(0, list.length - 1));
  const current = list[state.dev.index];
  const placedCount = list.filter(b => state.dev.placed[b.code]).length;
  panel.innerHTML = `
    <div class="dev-head"><span>Pin placer</span><span>${placedCount}/${list.length} placed</span></div>
    <select id="devSelect">${list.map((b, i) => `<option value="${i}" ${i === state.dev.index ? "selected" : ""}>${state.dev.placed[b.code] ? "✓ " : "· "}${esc(b.code)} — ${esc(b.name)}</option>`).join("")}</select>
    <p class="dev-tip">Tap the map where <b>${current ? esc(current.code) : "…"}</b> goes. The config line is logged and copied; the panel auto-advances.</p>
    <div class="dev-actions"><button type="button" id="devCopyAll">Copy all</button><button type="button" class="secondary" id="devSkip">Skip</button></div>`;
  panel.querySelector("#devSelect").addEventListener("change", e => { state.dev.index = Number(e.target.value); renderDevPanel(); devHighlight(); });
  panel.querySelector("#devCopyAll").addEventListener("click", devCopyAll);
  panel.querySelector("#devSkip").addEventListener("click", () => { devAdvance(); renderDevPanel(); devHighlight(); });
  devHighlight();
}

function devHighlight() {
  const current = devBuildingList()[state.dev.index];
  document.querySelectorAll(".pin").forEach(p => p.classList.toggle("dev-current", !!current && p.dataset.code === current.code));
}

function devSelectBuilding(code) {
  const i = devBuildingList().findIndex(b => b.code === code);
  if (i < 0) return;
  state.dev.index = i;
  renderDevPanel();
  toast(`Selected ${code} — tap where it goes`);
}

function devAdvance() {
  const list = devBuildingList();
  for (let step = 1; step <= list.length; step++) {
    const i = (state.dev.index + step) % list.length;
    if (!state.dev.placed[list[i].code]) { state.dev.index = i; return; }
  }
}

// Screen → tilted plane → image pixels → percent of natural size.
function devPlaceAt(clientX, clientY, viewport) {
  if (!devPinEnabled()) return;
  const m = state.map;
  if (m.imageStatus !== "ready") { toast("Wait for the map image to load", "error"); return; }
  const { u, v } = planeToImage(screenToPlane(clientX, clientY, viewport.getBoundingClientRect()));
  const x = Math.round(u / m.W * 1000) / 10, y = Math.round(v / m.H * 1000) / 10;
  if (x < 0 || x > 100 || y < 0 || y > 100) { toast("That's off the map", "error"); return; }
  const b = devBuildingList()[state.dev.index];
  if (!b) return;
  state.dev.placed[b.code] = { x, y };
  const live = state.buildings.find(bb => bb.code === b.code);
  if (live) { live.x = x; live.y = y; }
  const pins = document.getElementById("mapPins");
  if (pins) renderPins(pins);
  const line = devConfigLine(b, x, y);
  console.log(line);
  devAdvance();
  renderDevPanel();
  copyText(line).then(ok => toast(`Placed ${b.code} at ${x}, ${y}${ok ? " · line copied" : " · see console"}`, "ok"));
}

function devConfigLine(b, x, y) {
  const cfg = CONFIG.campus.buildings.find(c => c.code === b.code);
  const floors = cfg ? cfg.floors : (b.id ? floorsOf(b.id).length : 0);
  return `{ code: "${b.code}", name: "${b.name.replace(/"/g, '\\"')}", x: ${x}, y: ${y}, floors: ${floors} },`;
}

function devCopyAll() {
  const lines = devBuildingList().map(b => {
    const p = state.dev.placed[b.code] || { x: b.x, y: b.y };
    return "  " + devConfigLine(b, p.x, p.y);
  });
  const text = `buildings: [\n${lines.join("\n")}\n],`;
  console.log(text);
  copyText(text).then(ok => toast(ok ? "Copied the full buildings array" : "Clipboard blocked — array is in the console", "ok"));
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch { return false; } // clipboard needs https + a user gesture
}

/* =====================================================================
   INIT
   ===================================================================== */
function init() {
  document.documentElement.style.setProperty("--map-tilt", CONFIG.campus.mapTiltDeg + "deg");
  document.getElementById("brandName").textContent = CONFIG.campus.appName;
  document.getElementById("brandMark").textContent = CONFIG.campus.appName.slice(0, 1).toUpperCase();
  document.title = `${CONFIG.campus.appName} · ${CONFIG.SCHOOL_SLUG.replace(/^\w/, c => c.toUpperCase())}`;

  window.addEventListener("hashchange", handleRouteChange);
  window.addEventListener("online", () => { state.online = true; renderBanners(); if (state.status === "error") loadCampus(); else render(); });
  window.addEventListener("offline", () => { state.online = false; renderBanners(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && state.modal) closeModal(); });

  if (!location.hash) navigate("/map", { replace: true });
  state.route = parseRoute(location.hash);
  loadCampus();
}

init();
</script>
</body>
</html>
